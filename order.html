<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Your Box</title>
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/customize.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="subscription-listing.html">Subscription Listings</a>
    <a href="tracking.html">Order Tracking</a>
    <a href="order.html">Order Box</a>
    <a href="customize.html">Customize Box</a>
    <a href="contact.html">Contact Us</a>
    <a href="login.html">Login</a>
  </nav>

  <header>
    <h1>Order Your Subscription Box</h1>
    <p>Order your prefferred box.</p>
    <form>
      <label for="boxType">Select Box Type:</label>
      <select id="boxType">
        <option value="books">Books</option>
        <option value="snacks">Snacks</option>
        <option value="wellness">Wellness Products</option>
      </select>
      <button type="button" onclick="redirectToPage()">Order</button>
    </form>
    
    <script>
      function redirectToPage() {
        const boxType = document.getElementById("boxType").value;
        let url = "";
    
        if (boxType === "books") {
          url="books.html";
        } else if (boxType === "snacks") {
          url = "snacks.html";
        } else if (boxType === "wellness") {
          url = "wellness.html";
        }
    
        // Redirect to the selected page
        if (url) {
          window.location.href = url;
        }
      }
    </script>
    
  </header>

  <footer>
    <p>&copy; 2024 Subscription Box Service </p>
  </footer>
</body>
</html>
